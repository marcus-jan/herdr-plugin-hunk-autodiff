id = "hunk.autodiff"
name = "Hunk Auto Diff"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Keep background hunk tabs of the PR diff, unpushed, uncommitted, and last-turn changes when a coding agent finishes."
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "autodiff.py", "event"]

[[events]]
on = "worktree.created"
command = ["python3", "autodiff.py", "event"]

[[actions]]
id = "open"
title = "Hunk: open diff tabs"
contexts = ["workspace"]
command = ["python3", "autodiff.py", "open"]

[[actions]]
id = "reset-baseline"
title = "Hunk: reset diff baseline to HEAD and close tabs"
contexts = ["workspace"]
command = ["python3", "autodiff.py", "reset"]
